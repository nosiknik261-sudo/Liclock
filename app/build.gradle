plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.sova.liclock'
    compileSdk 34

    defaultConfig {
        applicationId 'ru.sova.liclock'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // подписываем debug-ключом, чтобы APK сразу ставился в машину
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
