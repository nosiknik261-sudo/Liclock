plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.sova.liclock'
    compileSdk 34

    defaultConfig {
        applicationId 'ru.sova.liclock'
        minSdk 26
        targetSdk 34
        // номер версии растёт с каждой сборкой на GitHub — RuStore требует это для обновлений
        def run = Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1")
        versionCode run
        versionName "1.0.${run}"
    }

    // Постоянный ключ: в GitHub Actions берётся из секретов KEYSTORE_BASE64 и KEYSTORE_PASSWORD.
    // Если секретов нет, APK подписывается временным debug-ключом.
    def ksFile = file("${rootDir}/release.jks")
    def ksPass = System.getenv("KEYSTORE_PASSWORD")
    signingConfigs {
        release {
            if (ksFile.exists() && ksPass) {
                storeFile ksFile
                storePassword ksPass.trim()
                keyAlias 'liclock'
                keyPassword ksPass.trim()
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig = (ksFile.exists() && ksPass) ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
