name: Собрать APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Достать ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > release.jks
            SIZE=$(wc -c < release.jks)
            echo "Длина секрета: ${#KEYSTORE_BASE64} символов, ключ после расшифровки: $SIZE байт (ожидается 4314)"
            if [ "$SIZE" -lt 1000 ]; then
              echo "::error::В секрете KEYSTORE_BASE64 не то содержимое — нужно вставить весь файл keystore_base64.txt"
              exit 1
            fi
            echo "Подписываю постоянным ключом"
          else
            echo "::warning::Секрет KEYSTORE_BASE64 не задан — APK будет с временным ключом"
          fi

      - name: Сборка
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: LiClock-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Переименовать APK
        run: cp app/build/outputs/apk/release/app-release.apk LiClock.apk

      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Часы ${{ github.run_number }}
          make_latest: true
          files: LiClock.apk
