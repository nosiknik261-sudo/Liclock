name: Собрать APK «Уютный Новый год» (ТВ)

on:
  push:
    paths:
      - 'cozytv/**'
      - '.github/workflows/build-tv.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cozytv
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Достать ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > release.jks
            SIZE=$(wc -c < release.jks)
            if [ "$SIZE" -lt 1000 ]; then
              echo "::error::В секрете KEYSTORE_BASE64 не то содержимое"
              exit 1
            fi
            echo "Подписываю постоянным ключом ($SIZE байт)"
          else
            echo "::warning::Секрет KEYSTORE_BASE64 не задан — APK будет с временным ключом"
          fi

      - name: Сборка
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Переименовать APK
        run: cp app/build/outputs/apk/release/app-release.apk CozyNewYear.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CozyNewYear-apk
          path: cozytv/CozyNewYear.apk

      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-v1.0.${{ github.run_number }}
          name: Уютный Новый год ${{ github.run_number }}
          make_latest: false
          files: cozytv/CozyNewYear.apk
