<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Уютный Новый год</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;width:100vw;height:100vh}
#hint{position:fixed;left:50%;top:5vh;transform:translateX(-50%);font:500 2.4vh/1.4 Georgia,serif;color:#fff;background:rgba(0,0,0,.45);padding:1.4vh 3vh;border-radius:4vh;transition:opacity 1s;pointer-events:none;white-space:nowrap}
#ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:6vh;gap:2vh;background:linear-gradient(transparent 55%,rgba(0,0,0,.6));opacity:0;pointer-events:none;transition:opacity .4s;font-family:Georgia,serif}
#ui.show{opacity:1;pointer-events:auto}
.row{display:flex;gap:1.2vh;flex-wrap:wrap;justify-content:center}
.row button{font:500 2.4vh Georgia,serif;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);border-radius:4vh;padding:1.2vh 2.6vh;min-height:5.5vh}
.row button.on{background:#f3d27a;color:#3a2410;border-color:#f3d27a}
.row button:focus{outline:none;box-shadow:0 0 0 .5vh #fff,0 0 3vh rgba(255,230,160,.8);transform:scale(1.08)}
.row button{transition:transform .12s,box-shadow .12s}
.ttl{color:#fff;font:400 2.2vh Georgia,serif;opacity:.8}
.about{color:#fff;font:400 1.7vh Georgia,serif;opacity:.5;margin-top:1vh}
#clock{position:fixed;right:4vw;bottom:5vh;text-align:right;color:#fff8e8;font-family:Georgia,serif;text-shadow:0 0.3vh 2vh rgba(0,0,0,.8),0 0 1vh rgba(0,0,0,.6);pointer-events:none;transition:opacity 1s;opacity:0}
#clock.on{opacity:.92}
#ui.show~#clock{opacity:0}
#clock .t{font-size:9vh;line-height:1;letter-spacing:.02em;font-weight:400}
#clock .d{font-size:2.4vh;opacity:.85;margin-top:.8vh}
#clock .c{font-size:2.2vh;color:#f3d27a;margin-top:.6vh}
#greet{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;color:#fff3cf;font:italic 12vh Georgia,serif;text-shadow:0 0 3vh rgba(255,200,100,.8),0 0.5vh 2vh rgba(0,0,0,.8);opacity:0;transition:opacity 2s}
#greet.on{opacity:1}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hint">Коснитесь экрана, чтобы включить музыку</div>
<div id="ui">
 <div class="ttl" id="now"></div>
 <div class="row" id="scenes"></div>
 <div class="row" id="opts"></div>
 <div class="about">Музыка: мелодии народные и классические · сэмплы инструментов tonejs-instruments, лицензия CC BY 3.0</div>
</div>
<div id="clock"><div class="t"></div><div class="d"></div><div class="c"></div></div>
<div id="greet">С Новым годом!</div>
<script>
'use strict';
/* старые WebView на ТВ-приставках не знают roundRect — дорисуем сами */

 const[tl,tr,br,bl]=a.map(v=>Math.max(0,Math.min(v||0,Math.abs(w)/2,Math.abs(h)/2)));this.moveTo(x+tl,y);this.lineTo(x+w-tr,y);this.arcTo(x+w,y,x+w,y+tr,tr);this.lineTo(x+w,y+h-br);this.arcTo(x+w,y+h,x+w-br,y+h,br);this.lineTo(x+bl,y+h);this.arcTo(x,y+h,x,y+h-bl,bl);this.lineTo(x,y+tl);this.arcTo(x,y,x+tl,y,tl);this.closePath();return this};
const MODE=new URLSearchParams(location.search);const TV=MODE.has('tv'),DREAM=MODE.has('dream');
/* ================= Общие инструменты ================= */
const W=1920,H=1080;
const Q=Math.min(2,Math.max(1,((window.screen&&screen.width)||innerWidth)*(window.devicePixelRatio||1)/1920));

const LIGHTS=['255,206,110','255,110,96','120,200,255','150,240,170','255,160,230'];

/* спрайт мягкого огонька: рисуем один раз, потом только копируем — быстро даже на слабом ТВ */

 else{g.addColorStop(0,`rgba(255,255,255,1)`);g.addColorStop(0.12,`rgba(${rgb},1)`);g.addColorStop(0.35,`rgba(${rgb},0.35)`);g.addColorStop(1,`rgba(${rgb},0)`)}
 c.fillStyle=g;c.fillRect(0,0,128,128);return SPR[k]=s}
function blob(c,rgb,x,y,r,a,soft){c.globalAlpha=a;c.drawImage(sprite(rgb,soft),x-r,y-r,r*2,r*2);c.globalAlpha=1}
let FLK=null;function puff(c,x,y,r,a){if(!FLK){FLK=layer(64,64);const q=FLK.getContext('2d'),g=q.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(245,248,255,1)');g.addColorStop(0.5,'rgba(245,248,255,0.45)');g.addColorStop(1,'rgba(245,248,255,0)');q.fillStyle=g;q.fillRect(0,0,64,64)}c.globalAlpha=a;c.drawImage(FLK,x-r,y-r,r*2,r*2);c.globalAlpha=1}

/* ---------- снег ---------- */
function makeSnow(n,rMin,rMax,vMin,vMax,box){const a=[];for(let i=0;i<n;i++)a.push({x:rnd(box[0],box[2]),y:rnd(box[1],box[3]),r:rnd(rMin,rMax),v:rnd(vMin,vMax),p:rnd(0,7),box});return a}
function drawSnow(c,fl,t,dt,soft){for(const f of fl){f.y+=f.v*dt;f.x+=Math.sin(t*0.5+f.p)*f.v*0.3*dt;const b=f.box;
 if(f.y>b[3]+20){f.y=b[1]-20;f.x=rnd(b[0],b[2])}if(f.x<b[0]-20)f.x=b[2];if(f.x>b[2]+20)f.x=b[0];
 if(soft)puff(c,f.x,f.y,f.r*1.6,0.5);else{c.globalAlpha=0.9;c.fillStyle='#f4f8ff';c.beginPath();c.arc(f.x,f.y,f.r,0,7);c.fill();c.globalAlpha=1}}}

/* ---------- живая ёлка из иголок ---------- */
function needleTree(c,cx,base,h,w,o){const R=seeded(o.seed||5),top=base-h,lights=[],balls=[];
 const pal=o.pal||{dark:'#0b3a22',mid:'#1d6a3c',light:'#3f9a5c',rim:'#86c9a0'};
 c.fillStyle='#3a2416';c.fillRect(cx-h*0.025,base-h*0.06,h*0.05,h*0.08);
 function branch(x0,y0,x1,y1,side,depth){const len=Math.hypot(x1-x0,y1-y0),n=len/4|0,ang=Math.atan2(y1-y0,x1-x0);

   for(const s of[-1,1]){const a=ang+s*(0.75+R()*0.35)+0.25,lit=(side>0?0.25:-0.15)+(depth?0.3:-0.4)+(s<0?0.15:-0.1)+R()*0.3;
    c.strokeStyle=lit>0.35?pal.light:lit>0?pal.mid:pal.dark;c.lineWidth=2.2;c.beginPath();c.moveTo(x,y);c.lineTo(x+Math.cos(a)*nl,y+Math.sin(a)*nl);c.stroke()}}
  if(o.snow&&depth&&side>0===(R()<0.7)){c.fillStyle='rgba(236,243,255,0.9)';for(let i=4;i<n;i+=7){const u=i/n,x=x0+(x1-x0)*u,y=y0+(y1-y0)*u+Math.sin(u*Math.PI)*len*0.06;c.beginPath();c.ellipse(x,y-4,6+R()*5,2.5+R()*2,ang*0.6,0,7);c.fill()}}

 const steps=Math.round(h/16);
 for(const depth of[0,1])for(let i=0;i<steps;i++){const v=i/steps,y=top+h*0.05+v*h*0.88,r=w*0.5*Math.pow(v,0.92)*(0.9+0.1*Math.sin(i*1.7))+12,nb=depth?9:7;
  for(let k=0;k<nb;k++){const u=(k/(nb-1))*2-1+(depth?0:1/nb)+(R()-0.5)*0.12;if(Math.abs(u)>1.05)continue;const side=Math.sign(u)||1;
   const tipx=cx+u*r,tipy=y+r*0.28*(1-Math.abs(u)*0.6)+(depth?r*0.06:-r*0.05);branch(cx+u*6,y-r*0.15,tipx,tipy,side,depth);
   if(depth&&i>2&&R()<0.2+0.4*v)lights.push([tipx-u*r*0.15+(R()-0.5)*20,tipy-6+(R()-0.5)*14,(i+k)%LIGHTS.length,R()*7]);
   if(depth&&o.balls&&i>3&&i%3===0&&R()<(o.fewBalls?0.25:0.45)&&Math.abs(u)<0.85)balls.push([tipx-u*r*0.25,tipy+8,6+h*0.018*(0.6+v*0.6)])}}
 for(const[x,y,r]of balls){const col=['#c8262f','#e9b443','#2f6fd0','#9b3ad6','#e9ecf4','#1f9a6a'][R()*6|0];bauble(c,x,y,r,col)}

}
function bauble(c,x,y,r,col){const g=c.createRadialGradient(x-r*0.35,y-r*0.4,r*0.08,x,y,r);g.addColorStop(0,'#fff');g.addColorStop(0.22,shade(col,0.3));g.addColorStop(0.7,col);g.addColorStop(1,shade(col,-0.6));

function starShape(c,x,y,r){c.beginPath();for(let i=0;i<10;i++){const rr=i%2?r*0.45:r,an=-Math.PI/2+i*Math.PI/5;c.lineTo(x+Math.cos(an)*rr,y+Math.sin(an)*rr)}c.closePath()}
function drawStar(c,e,x,y,r,a){const g=c.createRadialGradient(x-r*0.2,y-r*0.3,0,x,y,r);g.addColorStop(0,'#fffbe0');g.addColorStop(0.6,'#ffd35a');g.addColorStop(1,'#d89a1c');c.fillStyle=g;starShape(c,x,y,r);c.fill();
 blob(e,'255,214,110',x,y,r*4,0.9*a);blob(e,'255,240,200',x,y,r*1.6,a)}
function drawLights(c,e,lights,t,size){for(const[x,y,ci,p]of lights){const a=0.6+0.4*Math.sin(t*1.8+p*3),rgb=LIGHTS[(ci+Math.floor(t/5+p))%LIGHTS.length];

 blob(c,rgb,x,y,size*5,0.45*a);blob(e,rgb,x,y,size*7,a)}}
function gift(c,x,y,w,h,col,rib){const g=c.createLinearGradient(x,y,x+w,y+h);g.addColorStop(0,shade(col,0.25));g.addColorStop(1,shade(col,-0.4));
 c.fillStyle='rgba(0,0,0,0.3)';c.beginPath();c.ellipse(x+w/2,y+h+4,w*0.6,10,0,0,7);c.fill();
 c.fillStyle=g;c.beginPath();c.roundRect(x,y,w,h,10);c.fill();c.fillStyle=shade(col,0.15);c.beginPath();c.roundRect(x-6,y-h*0.18,w+12,h*0.24,8);c.fill();
 c.fillStyle=rib;c.fillRect(x+w*0.43,y-h*0.18,w*0.14,h*1.18);c.fillRect(x-6,y+h*0.28,w+12,h*0.11);
 c.fillStyle=shade(rib,0.15);c.beginPath();c.ellipse(x+w*0.34,y-h*0.27,w*0.18,h*0.12,-0.5,0,7);c.ellipse(x+w*0.66,y-h*0.27,w*0.18,h*0.12,0.5,0,7);c.fill();
 c.fillStyle=shade(rib,-0.3);c.beginPath();c.arc(x+w*0.5,y-h*0.2,w*0.07,0,7);c.fill();
 c.fillStyle='rgba(255,255,255,0.18)';c.fillRect(x+4,y+4,w*0.18,h-8)}

/* ================= Снег с глубиной и ветром ================= */
const CRY=[];(function(){for(let v=0;v<4;v++){const s=layer(96,96),c=s.getContext('2d');c.translate(48,48);
 const g=c.createRadialGradient(0,0,0,0,0,44);g.addColorStop(0,'rgba(255,255,255,0.35)');g.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=g;c.beginPath();c.arc(0,0,44,0,7);c.fill();
 c.strokeStyle='rgba(250,252,255,0.95)';c.lineCap='round';
 for(let i=0;i<6;i++){c.save();c.rotate(i*Math.PI/3);c.lineWidth=3.2;c.beginPath();c.moveTo(0,0);c.lineTo(0,-36);c.stroke();c.lineWidth=2.2;
  const br=[[0.35,0.32],[0.6,0.24],[0.82,0.14]].slice(0,2+(v%2));for(const[u,l]of br){const y=-36*u,L=36*l*(v===2?1.3:1);c.beginPath();c.moveTo(0,y);c.lineTo(-L*0.7,y-L*0.7);c.moveTo(0,y);c.lineTo(L*0.7,y-L*0.7);c.stroke()}
  if(v===3){c.beginPath();c.moveTo(-5,-14);c.lineTo(5,-14);c.stroke()}c.restore()}
 c.fillStyle='#fff';c.beginPath();c.arc(0,0,4,0,7);c.fill();CRY.push(s)}})();
const WIND={v:0,g:0,next:20};
function windAt(t,dt){WIND.next-=dt;if(WIND.next<0){WIND.g=1;WIND.next=25+Math.random()*30}WIND.g=Math.max(0,WIND.g-dt*0.22);
 const gust=Math.sin(Math.min(1,WIND.g)*Math.PI)*110;WIND.v=22*Math.sin(t*0.06)+12*Math.sin(t*0.21+1)+gust;return WIND.v}
class Snow{constructor(n,box,zmin,zmax){this.box=box;this.f=[];for(let i=0;i<n;i++){const z=zmin+Math.pow(Math.random(),1.6)*(zmax-zmin);
  this.f.push({x:rnd(box[0],box[2]),y:rnd(box[1],box[3]),z,p:rnd(0,7),rot:rnd(0,7),rs:rnd(-1,1),v:CRY.length?Math.random()*4|0:0})}this.f.sort((a,b)=>a.z-b.z)}
 draw(c,t,dt,wind,warm){const b=this.box;for(const f of this.f){const z=f.z,vy=(22+48*z)*(0.85+0.15*Math.sin(t*0.9+f.p));
  f.y+=vy*dt;f.x+=(wind*z*0.9+Math.sin(t*0.7+f.p)*14*z)*dt;f.rot+=f.rs*dt*(0.6+wind*0.004);
  if(f.y>b[3]+40){f.y=b[1]-40;f.x=rnd(b[0]-80,b[2])}if(f.x>b[2]+60)f.x=b[0]-50;if(f.x<b[0]-60)f.x=b[2]+50;
  if(z<0.9){const q=1+z*2.4;c.globalAlpha=0.45+z*0.55;c.fillStyle='#f2f6ff';c.beginPath();c.arc(f.x,f.y,q,0,7);c.fill()}
  else if(z<1.2){const s=5+z*9;c.globalAlpha=0.8;c.save();c.translate(f.x,f.y);c.rotate(f.rot);c.drawImage(CRY[f.v],-s,-s,s*2,s*2);c.restore()}
  else{puff(c,f.x,f.y,5+z*4,0.55)}}c.globalAlpha=1}}
/* ================= СЦЕНА 1: Зимняя деревня ================= */
/* ================= Предметы натюрмортов: мандарины, миска, кружка, свеча, пряничный домик, веточка ================= */
const PROPS=(()=>{
 const TAU=Math.PI*2;
 function shadow(c,x,y,rx,ry,a){const g=c.createRadialGradient(x,y,0,x,y,rx);g.addColorStop(0,`rgba(30,12,4,${a})`);g.addColorStop(0.6,`rgba(30,12,4,${a*0.45})`);g.addColorStop(1,'rgba(30,12,4,0)');c.save();c.translate(x,y);c.scale(1,ry/rx);c.translate(-x,-y);c.fillStyle=g;c.beginPath();c.arc(x,y,rx,0,TAU);c.fill();c.restore()}

 /* мандарин: приплюснутый шар, пористая кожура, блик, плодоножка, по желанию листик */
 function tangerine(c,x,y,r,o={}){const R=seeded(o.seed||(x*7+y*13|0)+1),ry=r*0.84,rot=o.rot||0;

  g=c.createRadialGradient(r*0.2,ry*1.1,0,r*0.2,ry*1.1,r*0.9);g.addColorStop(0,'rgba(255,170,80,0.45)');g.addColorStop(1,'rgba(255,170,80,0)');c.fillStyle=g;c.fillRect(-r,-ry,r*2,ry*2);

  const n=Math.round(r*r*0.35);for(let i=0;i<n;i++){const a=R()*TAU,d=Math.sqrt(R()),px=Math.cos(a)*d*r,py=Math.sin(a)*d*ry,s=0.4+R()*0.7*(r/40);

   c.fillStyle=`rgba(150,60,0,${0.05+0.08*(1-lit)})`;c.beginPath();c.arc(px,py,s,0,TAU);c.fill();
   c.fillStyle=`rgba(255,236,190,${0.12+0.25*lit})`;c.beginPath();c.arc(px-s*0.5,py-s*0.5,s*0.55,0,TAU);c.fill()}
  // мягкий блик и острый блик
  g=c.createRadialGradient(-r*0.36,-ry*0.44,0,-r*0.36,-ry*0.44,r*0.42);g.addColorStop(0,'rgba(255,250,235,0.65)');g.addColorStop(1,'rgba(255,250,235,0)');c.fillStyle=g;c.beginPath();c.ellipse(-r*0.36,-ry*0.44,r*0.42,r*0.3,-0.6,0,TAU);c.fill();
  c.fillStyle='rgba(255,255,255,0.8)';c.beginPath();c.ellipse(-r*0.42,-ry*0.5,r*0.09,r*0.05,-0.6,0,TAU);c.fill();
  // контур-тень по краю

 for(const k in MIX){const g=AC.createGain();g.gain.value=MIX[k].g;const p=AC.createStereoPanner?AC.createStereoPanner():null;if(p){p.pan.value=MIX[k].pan;g.connect(p);p.connect(master);p.connect(revIn)}else{g.connect(master);g.connect(revIn)}BUS[k]=g}
 const bells=AC.createGain();bells.gain.value=0.5;bells.connect(master);bells.connect(revIn);BUS.bells=bells;
 const jobs=[];for(const k in INST)for(const n of INST[k])jobs.push(loadBuf(`s/${k}/${n}.mp3`).then(b=>{if(b)(BUF[k]=BUF[k]||[]).push({m:nm(n),b})}));
 await Promise.all(jobs);loaded=true}
function play(inst,m,t,d,v,o={}){const L=BUF[inst];if(!L||!L.length)return;let best=L[0];for(const s of L)if(Math.abs(s.m-m)<Math.abs(best.m-m))best=s;
 const src=AC.createBufferSource();src.buffer=best.b;src.playbackRate.value=Math.pow(2,(m-best.m)/12);const g=AC.createGain();
 const at=o.a||0.004,rl=o.r||0.5,vv=v*(0.9+Math.random()*0.2),tt=t+(Math.random()-0.5)*0.016;
 g.gain.setValueAtTime(0,tt);g.gain.linearRampToValueAtTime(vv,tt+at);g.gain.setValueAtTime(vv,tt+Math.max(at,d));g.gain.exponentialRampToValueAtTime(0.0005,tt+Math.max(at,d)+rl);
 src.connect(g);g.connect(BUS[inst]);src.start(tt);src.stop(tt+Math.max(at,d)+rl+0.1)}
function sleigh(t,v){const n=AC.sampleRate*0.18,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++){const k=i/n;d[i]=(Math.random()*2-1)*Math.pow(1-k,5)*(1+0.6*Math.sin(i*0.9))}
 const s=AC.createBufferSource(),bp=AC.createBiquadFilter(),g=AC.createGain();bp.type='bandpass';bp.frequency.value=7500+Math.random()*1500;bp.Q.value=1.2;g.gain.value=0.22*v;s.buffer=b;s.connect(bp);bp.connect(g);g.connect(BUS.bells);s.start(t+(Math.random()-0.5)*0.01)}

/* аранжировка одного прохода мелодии: возвращает список событий */
function arrange(T,p,t0){const beat=60/T.bpm,ev=[],E=(i,m,t,d,v,o)=>ev.push([t0+t*beat,i,m,d*beat,v,o]);
 const melI={jingle:['piano','violin'],lullaby:['flute','violin'],waltz:['piano','violin'],shchedryk:['harp','violin'],tannenbaum:['piano','violin']}[T.style][p];
 for(const n of T.mel){const sus=melI==='violin'||melI==='flute';E(melI,n.m+(melI==='violin'&&p===1&&T.style!=='lullaby'?0:0),n.t,sus?n.d*0.98:n.d,sus?0.6:0.75,sus?{a:0.06,r:0.35}:{r:0.9});
  if(p===1&&T.style==='waltz'&&n.d>=1)E('xylophone',n.m+12,n.t,0.3,0.35,{r:0.8});
  if(p===1&&T.style==='jingle')E('piano',n.m+12,n.t,n.d*0.5,0.28,{r:0.5});
  if(p===1&&T.style==='shchedryk')E('flute',n.m+12,n.t,n.d,0.25,{a:0.05,r:0.3})}
 for(const C of T.ch){if(!C.c)continue;const c=C.c,bars=[];for(let x=0;x<C.d;x+=T.bar)bars.push([C.t+x,Math.min(T.bar,C.d-x)]);
  const pad=c.t.map(pc=>near(pc,64)),bass2=near(c.bass,40),bass3=near(c.bass,52);
  // струнная подложка
  for(const m of pad)E('violin',m,C.t,C.d,T.style==='lullaby'?0.16:0.12,{a:0.6,r:1.2});
  E('cello',bass2+(T.style==='shchedryk'?0:12)-12,C.t,C.d,0.45,{a:0.15,r:0.8});
  for(const[bt,bl]of bars){
   if(T.style==='jingle'){for(let k=0;k<bl;k++){if(k%2===0)E('piano',k===0?bass3:near(c.t[2],48),bt+k,0.5,0.55,{r:0.3});else for(const m of c.t.map(pc=>near(pc,60)))E('piano',m,bt+k,0.35,0.32,{r:0.25})}
    for(let k=0;k<bl*2;k++)ev.push([t0+(bt+k*0.5)*beat,'_bell',0,0,k%2?0.6:1])}
   if(T.style==='lullaby'){const arp=[near(c.bass,48),near(c.t[2],55),near(c.r,60),near(c.t[1],64),near(c.r,60),near(c.t[2],55)];for(let k=0;k<bl;k++)E('harp',arp[k%6],bt+k,1.5,0.5,{r:1.5})}
   if(T.style==='waltz'||T.style==='tannenbaum'){E('piano',bass3-12,bt,1,0.55,{r:0.6});for(let k=1;k<bl;k++)for(const m of c.t.map(pc=>near(pc,62)))E(T.style==='waltz'?'piano':'harp',m,bt+k,0.5,T.style==='waltz'?0.3:0.38,{r:0.4})}
   if(T.style==='shchedryk'){E('piano',bass3-12,bt,bl,0.5,{r:1});if(p===1)for(const m of c.t.map(pc=>near(pc,67)))E('violin',m,bt,bl,0.1,{a:0.3,r:0.8})}}}
 if(p===1&&T.style!=='shchedryk'){for(let k=0;k<10;k++)E('harp',near([0,2,4,7,9][k%5],48+k*3),-0.6+k*0.06,1.2,0.35,{r:1.2})}
 return{ev:ev.sort((a,b)=>a[0]-b[0]),end:t0+T.len*beat}}
function nextPass(){const T=PARSED[tuneIdx],start=Math.max(AC.currentTime+0.15,passEnd);const r=arrange(T,pass,start+(pass===1?0.6:0));queue.push(...r.ev);passEnd=r.end+(pass===1?2.5:0.4);nowName=T.name;
 pass++;if(pass>1){pass=0;tuneIdx=(tuneIdx+1)%PARSED.length}showNow()}
function schedule(){if(!AC||!musicOn||!loaded)return;if(queue.length<20&&AC.currentTime>passEnd-3)nextPass();
 const lim=AC.currentTime+0.4;while(queue.length&&queue[0][0]<lim){const[t,i,m,d,v,o]=queue.shift();if(t<AC.currentTime-0.05)continue;if(i==='_bell')sleigh(t,v);else play(i,m,t,d,v,o)}}
async function startMusic(){await initAudio();AC.resume();if(!timer)timer=setInterval(schedule,60);showNow()}
function stopMusic(){if(AC)AC.suspend()}
function skipTune(){if(!AC)return;queue=[];pass=0;tuneIdx=(tuneIdx+1)%PARSED.length;passEnd=AC.currentTime+0.2}

/* ================= Кадр: свечение, виньетка, зерно ================= */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let scale=1,ox=0,oy=0;
let RS=2,fpsN=0,fpsT=0;function resize(){const d=Math.min(RS,window.devicePixelRatio||1);cv.width=innerWidth*d;cv.height=innerHeight*d;scale=Math.max(cv.width/W,cv.height/H);ox=(cv.width-W*scale)/2;oy=(cv.height-H*scale)/2}
addEventListener('resize',resize);resize();
const EM=layer(W/4,H/4),em=EM.getContext('2d'),EM2=layer(W/16,H/16),em2=EM2.getContext('2d');
const VIG=layer(),vg=VIG.getContext('2d');(()=>{const g=vg.createRadialGradient(W/2,H*0.52,H*0.35,W/2,H/2,H*1.05);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(8,4,12,0.62)');vg.fillStyle=g;vg.fillRect(0,0,W,H)})();
const GR=layer(256,256),gr=GR.getContext('2d');(()=>{const d=gr.createImageData(256,256);for(let i=0;i<d.data.length;i+=4){const v=128+(Math.random()-0.5)*90;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}gr.putImageData(d,0,0)})();
const GRAIN=ctx.createPattern(GR,'repeat');
const GRADE=[['rgba(255,170,110,0.10)','rgba(70,90,170,0.10)'],['rgba(255,150,70,0.14)','rgba(120,40,30,0.10)'],['rgba(255,180,120,0.10)','rgba(60,30,90,0.12)'],['rgba(255,170,110,0.06)','rgba(60,140,140,0.10)'],['rgba(255,170,90,0.14)','rgba(60,60,120,0.08)']];
function render(sc,i,t,dt,alpha){em.setTransform(0.25,0,0,0.25,0,0);em.clearRect(0,0,W,H);
 const z=1.035+0.02*Math.sin(t*0.05+i),px=Math.sin(t*0.031+i*2)*18,py=Math.cos(t*0.027+i)*10;ctx.save();ctx.translate(W/2+px,H/2+py);ctx.scale(z,z);ctx.translate(-W/2,-H/2);em.translate(W/2+px,H/2+py);em.scale(z,z);em.translate(-W/2,-H/2);
 ctx.globalAlpha=alpha;sc.draw(ctx,em,t,dt);ctx.restore();ctx.globalAlpha=alpha;
 em2.clearRect(0,0,W/16,H/16);em2.drawImage(EM,0,0,W/16,H/16);
 const bs=[0.35,0.55,0.6,0.45,0.5][i];ctx.globalCompositeOperation='lighter';ctx.globalAlpha=bs*alpha;ctx.drawImage(EM,0,0,W,H);ctx.globalAlpha=bs*1.2*alpha;ctx.drawImage(EM2,0,0,W,H);
 ctx.globalCompositeOperation='soft-light';ctx.globalAlpha=alpha;const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,GRADE[i][1]);g.addColorStop(1,GRADE[i][0]);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1}

/* ================= Смена сцен и меню ================= */
const PERIODS=[1,3,5];const LS=k=>{try{return localStorage.getItem(k)}catch(e){return null}},SS=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let period=+(LS('ny_period')||3),clockOn=LS('ny_clock')!=='0',volume=+(LS('ny_vol')||0.8);
/* ---- часы и обратный отсчёт ---- */
const MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'],DOW=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const plural=(n,a,b,c)=>{n=Math.abs(n)%100;const m=n%10;return n>10&&n<20?c:m>1&&m<5?b:m===1?a:c};
let greeted=false;
function tickClock(){const el=document.getElementById('clock');el.classList.toggle('on',clockOn);if(!clockOn)return;
 const d=new Date(),hh=String(d.getHours()).padStart(2,'0'),mm=String(d.getMinutes()).padStart(2,'0');
 el.querySelector('.t').textContent=hh+(d.getSeconds()%2?' ':':')+mm;
 el.querySelector('.d').textContent=DOW[d.getDay()]+', '+d.getDate()+' '+MON[d.getMonth()];
 const ny=new Date(d.getFullYear()+(d.getMonth()===0&&d.getDate()<8?0:1),0,1);let txt='';
 if(d.getMonth()===0&&d.getDate()<8)txt='С Новым '+d.getFullYear()+' годом!';
 else{const ms=ny-d,days=Math.floor(ms/864e5);
  if(days>=1)txt='До Нового года '+days+' '+plural(days,'день','дня','дней');
  else{const h=Math.floor(ms/36e5),m=Math.floor(ms/6e4)%60;txt=h>0?'До Нового года '+h+' '+plural(h,'час','часа','часов')+' '+m+' мин':'До Нового года '+m+' '+plural(m,'минута','минуты','минут')}}
 el.querySelector('.c').textContent=txt;
 if(!greeted&&d.getMonth()===0&&d.getDate()===1&&d.getHours()===0&&d.getMinutes()<3){greeted=true;celebrate()}}
setInterval(tickClock,500);tickClock();
/* ---- салют в полночь (и по ?salute=1) ---- */
const FW=[];let fwUntil=0;
function celebrate(){fwUntil=performance.now()/1000+150;document.getElementById('greet').classList.add('on');setTimeout(()=>document.getElementById('greet').classList.remove('on'),20000)}
function fireworks(c,e,t,dt){if(t>fwUntil&&!FW.length)return;
 if(t<fwUntil&&Math.random()<dt*1.3){const x=rnd(200,W-200),y=rnd(120,H*0.45),col=['255,120,90','255,220,120','140,200,255','255,150,220','150,255,170'][Math.random()*5|0];
  for(let i=0;i<70;i++){const a=Math.random()*Math.PI*2,v=rnd(60,260);FW.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,a:1,col,r:rnd(2,4.5)})}}
 for(let i=FW.length-1;i>=0;i--){const f=FW[i];f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=90*dt;f.vx*=0.985;f.a-=0.45*dt;if(f.a<=0){FW.splice(i,1);continue}
  c.strokeStyle=`rgba(${f.col},${f.a})`;c.lineWidth=f.r;c.beginPath();c.moveTo(f.x-f.vx*0.05,f.y-f.vy*0.05);c.lineTo(f.x,f.y);c.stroke();blob(e,f.col,f.x,f.y,14,f.a*0.9)}}
/* ---- не гасить экран ---- */
let wl=null;async function keepAwake(){try{if(navigator.wakeLock&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>wl=null)}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(AC)AC.suspend()}else{if(AC&&musicOn)AC.resume();keepAwake();last=performance.now()/1000}});
let cur=0,prev=-1,fadeStart=0,sceneStart=0,last=performance.now()/1000;
function go(i){if(i===cur)return;prev=cur;cur=i;fadeStart=performance.now()/1000;sceneStart=fadeStart;buildUI()}
function frame(){const now=performance.now()/1000,dt=Math.min(0.05,now-last);last=now;
 fpsN++;if(!fpsT)fpsT=now;if(now-fpsT>4){const fps=fpsN/(now-fpsT);if(fps<22&&RS>0.75){RS=RS>1?1:0.75;resize()}fpsN=0;fpsT=now}
 if(now-sceneStart>period*60)go((cur+1)%SCENES.length);
 ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,cv.width,cv.height);ctx.setTransform(scale,0,0,scale,ox,oy);
 const fa=Math.min(1,(now-fadeStart)/2.5);
 if(prev>=0&&fa<1){render(SCENES[prev],prev,now,dt,1);render(SCENES[cur],cur,now,dt,fa)}else render(SCENES[cur],cur,now,dt,1);
 if(FW.length||last<fwUntil){em.setTransform(0.25,0,0,0.25,0,0);em.clearRect(0,0,W,H);fireworks(ctx,em,now,dt);ctx.globalCompositeOperation='lighter';ctx.globalAlpha=0.7;ctx.drawImage(EM,0,0,W,H);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over'}
 ctx.drawImage(VIG,0,0,W,H);ctx.globalCompositeOperation='overlay';ctx.globalAlpha=0.06;ctx.fillStyle=GRAIN;ctx.save();ctx.translate(Math.random()*256,Math.random()*256);ctx.fillRect(-256,-256,W+512,H+512);ctx.restore();ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
 requestAnimationFrame(frame)}
const ui=document.getElementById('ui');let hideT;
function showNow(){document.getElementById('now').textContent=(musicOn&&AC&&nowName?'♪ '+nowName+' · ':'')+SCENES[cur].name}
function btn(row,label,on,fn){const b=document.createElement('button');b.textContent=label;if(on)b.className='on';b.onclick=e=>{e.stopPropagation();const all=[...ui.querySelectorAll('button')],idx=all.indexOf(b);fn();buildUI();showUI();const nb=ui.querySelectorAll('button')[idx];if(nb&&(TV||e.detail===0))nb.focus()};row.appendChild(b)}
function buildUI(){const s=document.getElementById('scenes'),o=document.getElementById('opts');s.innerHTML='';o.innerHTML='';
 SCENES.forEach((sc,i)=>btn(s,sc.name,i===cur,()=>go(i)));
 btn(o,musicOn?'♪ Музыка: вкл':'♪ Музыка: выкл',musicOn,()=>{musicOn=!musicOn;musicOn?startMusic():stopMusic()});
 btn(o,'Следующая мелодия',false,()=>skipTune());
 btn(o,'Тише',false,()=>setVol(volume-0.15));btn(o,'Громче',false,()=>setVol(volume+0.15));
 PERIODS.forEach(p=>btn(o,'Смена: '+p+' мин',p===period,()=>{period=p;SS('ny_period',p)}));
 btn(o,clockOn?'Часы: вкл':'Часы: выкл',clockOn,()=>{clockOn=!clockOn;SS('ny_clock',clockOn?'1':'0');tickClock()});
 if(!TV&&document.fullscreenEnabled)btn(o,document.fullscreenElement?'Выйти из полного экрана':'Во весь экран',false,()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{}));
 showNow()}
function setVol(v){volume=Math.max(0,Math.min(1,v));SS('ny_vol',volume.toFixed(2));if(VOL)VOL.gain.setTargetAtTime(volume,AC.currentTime,0.05);document.getElementById('now').textContent='Громкость '+Math.round(volume*100)+'%';clearTimeout(setVol.h);setVol.h=setTimeout(showNow,1500)}
function hideUI(){ui.classList.remove('show');if(document.activeElement&&ui.contains(document.activeElement))document.activeElement.blur()}
function showUI(){if(DREAM)return;ui.classList.add('show');clearTimeout(hideT);hideT=setTimeout(hideUI,TV?9000:5000)}
function openMenu(){if(!AC&&musicOn)startMusic();document.getElementById('hint').style.opacity=0;showUI();const b=ui.querySelector('#scenes button.on')||ui.querySelector('button');b&&b.focus()}
/* кнопка «Назад» на пульте: true — закрыли меню, false — пусть приложение закрывается */
window.tvBack=()=>{if(ui.classList.contains('show')){hideUI();return true}return false};
document.addEventListener('click',()=>{if(DREAM)return;document.getElementById('hint').style.opacity=0;if(!AC&&musicOn)startMusic();ui.classList.contains('show')?hideUI():showUI()});
document.addEventListener('keydown',e=>{if(DREAM)return;const k=e.key;
 const back=k==='Escape'||k==='Backspace'||k==='GoBack'||k==='BrowserBack';
 if(ui.classList.contains('show')){/* меню открыто: стрелки ходят по кнопкам */
  const rows=[...ui.querySelectorAll('.row')].map(r=>[...r.querySelectorAll('button')]).filter(r=>r.length),a=document.activeElement;
  let ri=rows.findIndex(r=>r.includes(a)),ci=ri<0?0:rows[ri].indexOf(a);if(ri<0)ri=0;
  if(k==='ArrowRight'||k==='ArrowLeft'){ci=(ci+(k==='ArrowRight'?1:-1)+rows[ri].length)%rows[ri].length;rows[ri][ci].focus();showUI();e.preventDefault();return}
  if(k==='ArrowDown'||k==='ArrowUp'){const nr=Math.max(0,Math.min(rows.length-1,ri+(k==='ArrowDown'?1:-1)));const frac=rows[ri].length>1?ci/(rows[ri].length-1):0;rows[nr][Math.round(frac*(rows[nr].length-1))].focus();showUI();e.preventDefault();return}
  if(k==='Enter'||k===' '){if(a&&ui.contains(a)&&a.tagName==='BUTTON'){a.click()}else{const b=rows[0][0];b&&b.focus()}showUI();e.preventDefault();return}
  if(back){hideUI();e.preventDefault();return}
 }
 if(k==='ArrowRight')go((cur+1)%SCENES.length);else if(k==='ArrowLeft')go((cur+SCENES.length-1)%SCENES.length);
 else if(k==='ArrowUp'){setVol(volume+0.1);e.preventDefault()}else if(k==='ArrowDown'){setVol(volume-0.1);e.preventDefault()}
 else if(k==='m'||k==='ь'||k==='MediaPlayPause'){musicOn=!musicOn;musicOn?startMusic():stopMusic();buildUI()}
 else if(k==='c'||k==='с'){clockOn=!clockOn;SS('ny_clock',clockOn?'1':'0');tickClock();buildUI()}
 else if(k==='MediaTrackNext'||k==='MediaFastForward')skipTune();
 else if(back){}
 else if(k==='Enter'||k===' '||k==='ContextMenu'){openMenu();e.preventDefault()}
 });
document.addEventListener('click',keepAwake,{once:true});keepAwake();
setTimeout(()=>document.getElementById('hint').style.opacity=0,8000);
const q=new URLSearchParams(location.search);if(q.has('scene'))cur=+q.get('scene');if(q.has('salute'))setTimeout(celebrate,1500);
if(DREAM){musicOn=false;document.getElementById('hint').style.display='none';ui.style.display='none'}
else if(TV){document.getElementById('hint').textContent='OK на пульте — меню · ← → сцены · ↑ ↓ громкость';if(musicOn)setTimeout(()=>startMusic().catch(()=>{}),600)}
buildUI();requestAnimationFrame(frame);
</script>
